[package]
name = "turbo-tasks"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"

[lib]
bench = false

[features]
default = []
tokio_tracing = ["tokio/tracing"]
hanging_detection = []
task_id_details = []
verify_determinism = []

# Adds the devirtualized `Prod` arm to `TurboTasksHandle`, dispatching
# via `#[no_mangle] pub extern "Rust" fn __tt_static_*` symbols defined in
# `turbo-tasks-backend`. Activated by `turbo-tasks-backend`'s dep on
# `turbo-tasks`. Only binaries whose link graph includes
# `turbo-tasks-backend` can resolve the externs, which is also exactly
# the situation where the prod arm is meaningful to call.
#
# Crates that don't link `turbo-tasks-backend` (the workspace has many —
# `turbo-esregex`, `turbo-tasks-fs`'s lib-tests, etc.) compile without
# this feature: `TurboTasksHandle` falls back to `Arc<dyn TurboTasksApi>`
# vtable dispatch through the `Test` variant. Since those crates never
# actually run prod tasks, the perf delta is moot.
static_handle = []

# Adds the `Test` variant to `TurboTasksHandle`, which dispatches via
# `Arc<dyn TurboTasksApi>` vtable. Activated by `turbo-tasks-testing`'s
# dep on `turbo-tasks`. The test arm uses normal Rust vtable dispatch,
# so there's no linker-symbol footgun if the feature unifies on without
# the providing crate being directly linked.
dynamic_handle = []

# TODO(bgw): This feature is here to unblock turning on local tasks by default. It's only turned on
# in unit tests. This will be removed very soon.
non_operation_vc_strongly_consistent = []

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
auto-hash-map = { workspace = true }
bincode = { workspace = true }
concurrent-queue = { workspace = true }
ctor = { workspace = true }
dashmap = { workspace = true }
either = { workspace = true }
erased-serde = { workspace = true }
event-listener = "5.4.0"
futures = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
inventory = { workspace = true }
parking_lot = { workspace = true, features = ["serde"]}
pin-project-lite = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["rc", "derive"] }
serde_json = { workspace = true }
shrink-to-fit = { workspace = true, features = ["indexmap", "serde_json", "smallvec", "nightly"] }
smallvec = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
triomphe = { workspace = true, features = ["unsize", "unstable"] }
turbo-bincode = { workspace = true }
turbo-dyn-eq-hash = { workspace = true }
turbo-frozenmap = { workspace = true }
turbo-rcstr = { workspace = true }
turbo-tasks-hash = { workspace = true }
turbo-tasks-macros = { workspace = true }
turbo-tasks-malloc = { workspace = true }
unsize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "mod"
harness = false
