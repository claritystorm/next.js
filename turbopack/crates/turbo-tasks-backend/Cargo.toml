[package]
name = "turbo-tasks-backend"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
bench = false

[lints]
workspace = true

[features]
default = []

# Emits `#[no_mangle] pub extern "Rust" fn __tt_static_*` providers for
# the prod dispatch arm of `TurboTasksHandle` (see
# `turbo_tasks::handle`). Activates `turbo-tasks/static_handle` so the
# declarations and providers line up.
#
# Only the binary that actually runs prod turbo-tasks code (the
# `next-napi-bindings` napi addon) should enable this. Activating
# `static_handle` workspace-wide via feature unification would cause every
# linked test binary to need to resolve the providers, but most don't
# directly link `turbo-tasks-backend`. Explicit opt-in keeps the
# linker-symbol contract a binary-by-binary concern.
static_handle = ["turbo-tasks/static_handle"]

print_cache_item_size_with_compressed = ["print_cache_item_size", "dep:lzzzz"]
print_cache_item_size = []
no_fast_stale = []
aggregation_update_no_batch = []
verify_serialization = []
verify_aggregation_graph = []
verify_immutable = []
verify_determinism = ["turbo-tasks/verify_determinism"]
trace_aggregation_update_stats = []
trace_aggregation_update_queue = []
trace_aggregation_update = ["trace_aggregation_update_queue"]
trace_leaf_distance_update = []
trace_find_and_schedule = ["trace_aggregation_update_queue"]
trace_task_completion = []
trace_task_modification = []
trace_task_dirty = ["trace_aggregation_update_queue"]
trace_task_output_dependencies = []
trace_task_details = []
trace_prepare_tasks = []

[dependencies]
anyhow = { workspace = true }
bincode = { workspace = true }
auto-hash-map = { workspace = true }
bitfield = { workspace = true }
crossbeam-utils = { workspace = true }
dashmap = { workspace = true, features = ["raw-api"]}
either = { workspace = true }
hashbrown = { workspace = true, features = ["raw"] }
indexmap = { workspace = true }
lzzzz = { workspace = true, optional = true }
parking_lot = { workspace = true }
rand = { workspace = true }
ringmap = { workspace = true, features = ["serde"] }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
smallvec = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
turbo-bincode = { workspace = true }
turbo-persistence = { workspace = true }
turbo-rcstr = { workspace = true }
turbo-tasks = { workspace = true }
turbo-tasks-hash = { workspace = true }
turbo-tasks-malloc = { workspace = true, default-features = false }
thread_local = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
futures = { workspace = true }
indoc = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
triomphe = { workspace = true }
turbo-tasks-malloc = { workspace = true , features = ["custom_allocator"]}
rstest = { workspace = true }
turbo-tasks-testing = { workspace = true }
# Activate `static_handle` for this crate's own tests and benches.
# `TurboTasksHandle` dispatch through the dynamic arm would panic on the
# unreachable! arms in `VcStorage` (the test arm only implements the
# subset of `TurboTasksApi` that pure-storage tests need), so backend
# tests / benches that drive real work need the static arm wired up.
turbo-tasks-backend = { workspace = true, features = ["static_handle"] }


[[bench]]
name = "mod"
harness = false
